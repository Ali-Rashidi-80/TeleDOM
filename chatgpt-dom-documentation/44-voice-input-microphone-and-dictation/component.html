<div class="flex items-center gap-2 composer-voice-controls">
  <!-- Microphone / Dictation Trigger Button -->
  <button type="button" aria-label="Start voice mode / Dictation" data-testid="composer-speech-button" class="relative flex h-8 w-8 items-center justify-center rounded-full bg-token-main-surface-tertiary text-token-text-primary hover:bg-token-surface-hover active:scale-95 transition-all shadow-sm focus:outline-none">
    <!-- Microphone SVG Icon -->
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-token-text-primary">
      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      <line x1="12" y1="19" x2="12" y2="23"/>
      <line x1="8" y1="23" x2="16" y2="23"/>
    </svg>
  </button>

  <!-- Live Audio Waveform Animation (Active Recording State) -->
  <div class="hidden active-recording-waveform flex items-center gap-1 px-3 py-1.5 rounded-full bg-red-500/10 border border-red-500/30">
    <span class="h-2 w-0.5 animate-pulse bg-red-500 rounded-full"></span>
    <span class="h-4 w-0.5 animate-pulse bg-red-500 rounded-full" style="animation-delay: 150ms"></span>
    <span class="h-6 w-0.5 animate-pulse bg-red-500 rounded-full" style="animation-delay: 300ms"></span>
    <span class="h-3 w-0.5 animate-pulse bg-red-500 rounded-full" style="animation-delay: 450ms"></span>
    <span class="text-xs font-medium text-red-400 ml-1">درحال ضبط صدا...</span>
  </div>
</div>
